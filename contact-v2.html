<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me | Portfolio</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="container">
        <h1>Contact Me</h1>
        <form id="contact-form" novalidate>
            <div class="form-group">
                <label for="full-name">Full Name</label>
                <input 
                    type="text" 
                    id="full-name" 
                    name="name" 
                    placeholder="Enter your full name"
                    aria-describedby="name-error"
                    required
                >
                <div id="name-error" class="error-message" aria-live="polite"></div>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    placeholder="example@domain.com"
                    aria-describedby="email-error"
                    required
                >
                <div id="email-error" class="error-message" aria-live="polite"></div>
            </div>

            <div class="form-group">
                <label for="subject">Subject</label>
                <select id="subject" name="subject" aria-describedby="subject-error">
                    <option value="General Inquiry">General Inquiry</option>
                    <option value="Job Opportunity">Job Opportunity</option>
                    <option value="Collaboration">Collaboration</option>
                </select>
                <div id="subject-error" class="error-message" aria-live="polite"></div>
            </div>

            <div class="form-group">
                <label for="message">Message</label>
                <textarea 
                    id="message" 
                    name="message" 
                    placeholder="How can I help you?"
                    aria-describedby="message-error"
                    required
                ></textarea>
                <div id="message-error" class="error-message" aria-live="polite"></div>
            </div>

            <button type="submit">Send Message</button>
            
            <div id="form-status" aria-live="assertive"></div>
        </form>
    </main>

    <script src="script.js"></script>
</body>
</html>
